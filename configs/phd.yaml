# =============================================================================
# phd -- judgement cell, CF-Confess operator
# =============================================================================
# TERMINAL VALUES (paper numbers, Qwen2.5-Omni-7B, n=906):
#   CF-Confess  lambda=2.0, shared prompt v1  ->  Yes-F1 84.60 (Youden 0.542,
#   FPR 0.299); random-sign control arm 76.91; base_model v1 71.68 / 68.35.
#   PROVENANCE: RESULTS.md row 2026-08-15 (CF-Confess lam=2.0),
#     artifact   outputs/phd_cf_confess/cf_lam2.0_full_single_scored.jsonl
#     launcher   run_cf_confess_8gpu.sh (main arm = lam 2.0)
#     operator   cf_confess_phd.py  (merged into confess_pipeline.py verbatim)
#     probe      outputs/cf_probe/phd_probe.jsonl (signal basis, dev n=100)
#
# PROMPT: v1 is terminal. v2 (written evidence chain) and v3 (anti-priming
# instruction) were dev-rejected on the frozen mechanism (dev n=228:
# v2 78.29/0.479, v3 81.48/0.484 vs v1 84.39/0.550) -- RESULTS.md 2026-08-16,
# TRAJECTORY_ANALYSIS.md section 11. Registry: phd/baseline/v1, 581 chars,
# md5 985cb831 (OmniConfess/prompts/registry.json).
# =============================================================================

task_type: judgement
dataset: phd

data_path: OmniHalluBench/phd/phd.json        # 906 items (icc 629 / sec 277)
data_root: OmniHalluBench

prompt_version: v1        # terminal; see header
seed: 42
max_new_tokens: 300
record_process: true      # per-token trajectory (logp_list / token_ids / ...)

output_dir: outputs/pipeline/phd
time_path: outputs/pipeline/phd/time
file_name: cf_confess_phd

cf:
  variant: phd
  # Delta_cf = log P(Yes | image+question view) - log P(Yes | full view);
  # margin' = margin_full + lambda * Delta_cf; hard-force Yes iff margin' > 0.
  lambda_cf: 2.0          # terminal; dev-grid pick, probe outputs/cf_probe/
  w_audio: 1.0            # unused by the phd variant (single CF view)
  w_video: 1.0
  control: none           # 'random_sign' reproduces the 76.91 control arm

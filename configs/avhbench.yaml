# =============================================================================
# avhbench -- perception-heavy cell, Vote-SC (input-perturbation voting)
# =============================================================================
# TERMINAL VALUES (paper numbers, n=645, Token-F1):
#   Vote-SC 5-arm @>=2 votes  ->  21.56  (+2.14 vs base 19.42, Wilcoxon
#   p~1e-10; 333 win / 270 lose). Random-arm context: best single arm 384 =
#   19.76; base_sc (same-compute control) 18.29; oracle-of-5 26.72.
#   PROVENANCE: RESULTS.md row 2026-08-16 (Vote-SC), EXPERIMENT_DESIGN.md
#   "avhbench Vote-SC" section,
#     artifact   outputs/avhbench_vote_sc/avhbench_vote_sc_full.jsonl
#     rebuild    avhbench_vote_sc_rebuild.py (5arm@2 regression = 21.56
#                reproduced record-for-record; merged into confess_pipeline.py)
#
# THE FIVE ARMS (v1 prompt everywhere; same model except q3):
#   224  greedy, OMNI_FRAME_SIZE=224 / 8 frames   (= base_model input)
#   384  greedy, OMNI_FRAME_SIZE=384 / 8 frames   outputs/avhbench_res384/
#   448  greedy, OMNI_FRAME_SIZE=448 / 8 frames   outputs/avhbench_res448/
#   f16  greedy, 224 / 16 frames                 outputs/avhbench_frames16/
#   q3   Qwen3-Omni-30B-A3B-Instruct greedy      (cross-generation arm)
# Vote: content words (stopword-stripped, punctuation-stripped) corroborated by
# >= threshold arms, emitted in first-seen order; single-arm words dropped.
#
# NOT ADOPTED (pre-registered gate "> 21.56 + 0.5 = 22.06" -- all below it,
# EXPERIMENT_DESIGN.md avhbench extension section): 7arm@2 21.62, 6arm no-f16
# 21.77 (grey zone, p=0.47), skeleton backfill 21.69. The extension arms
# (t07a1/t07a2, avhbench_temp07_gen.py) and the backfill rule remain available
# in avhbench_vote_sc_rebuild.py; this config pins the shipped 5-arm system.
# The q3 arm needs the separate Qwen3-Omni venv
# (OmniConfess/methods/base_model_qwen3_omni.py); from-scratch cost of all
# arms ~ 3.3 GPU-h (EXPERIMENT_DESIGN.md section 3).
# =============================================================================

task_type: perception-heavy
dataset: avhbench

data_path: OmniHalluBench/avhbench/avhbench.json   # 645 items
data_root: OmniHalluBench

prompt_version: v1        # all arms, unchanged
seed: 42
record_process: true      # norm_logp feeds the skeleton arm selection

output_dir: outputs/pipeline/avhbench
time_path: outputs/pipeline/avhbench/time
file_name: avhbench_base_model

vote_sc:
  threshold: 2            # >=2 of 5 arms must corroborate a content word
  backfill: false         # skeleton phrasing backfill NOT in the shipped arm
  method: vote_sc_5arm
  out_dir: outputs/pipeline/avhbench
  out: avhbench_vote_sc_full.jsonl

  arms:                   # order = vote order (first-seen word order)
    224:
      path: outputs/avhbench_base_model/avhbench_base_model_full.jsonl
      kind: base
    384:
      path: outputs/avhbench_res384/avhbench_res384_full.jsonl
      kind: base
      OMNI_FRAME_SIZE: 384
    448:
      path: outputs/avhbench_res448/avhbench_res448_full.jsonl
      kind: base
      OMNI_FRAME_SIZE: 448
    f16:
      path: outputs/avhbench_frames16/avhbench_frames16_full.jsonl
      kind: base
      OMNI_NUM_FRAMES: 16
    q3:
      # cross-generation arm: different backbone, generated by
      # OmniConfess/methods/base_model_qwen3_omni.py (separate venv); the
      # pipeline consumes the artifact and never regenerates it.
      path: /ultrafast_share/tsq/qwen3omni_outputs/avhbench_qwen3omni/avhbench_qwen3omni_full.jsonl
      kind: external

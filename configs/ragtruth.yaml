# TERMINAL VALUES (paper numbers, Qwen2.5-Omni-7B, n=435):
#   base_model + prompt v4  ->  Token-F1 51.58 (GAVIE pending: -1 sentinel,
#   zhipu queue). Contract chain: v1 38.25 -> v2 45.87 -> v3 49.40 -> v4 51.58.
#   base arm stays 38.25; BoN-on-v3 was judged negative (48.55 < 49.40), so the
#   ragtruth terminal form is the contract layer alone (RESULTS.md 2026-08-15

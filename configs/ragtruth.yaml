task_type: descriptive-text
dataset: ragtruth

data_path: OmniHalluBench/ragtruth/ragtruth.json   # 435 items
data_root: OmniHalluBench

prompt_version: v4        # terminal contract version
seed: 42
max_new_tokens: 512
record_process: true

output_dir: outputs/pipeline/ragtruth
time_path: outputs/pipeline/ragtruth/time
file_name: ragtruth_contract_v4

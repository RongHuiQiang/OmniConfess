# PROMPT: v4 = v3 + consecutive-line numbered-list rule (keeps the whole answer
# inside the extractor window; 57/108 dev outputs matched
# r'\n\n\s*\d+\.\s' and the ">500 chars -> last paragraph" path dropped up to
# 92% of the words). v5 additionally bans blank lines after the last item --
# registered but not the terminal cell. Registry: ragtruth/baseline/v4,
# 1188 chars, md5 f3884f93; user template = v2/v3/v4/v5 shared branch.
#
# KNOWN CAVEAT (registry_verdicts.json ragtruth): Token-F1 here rewards length

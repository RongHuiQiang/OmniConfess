# =============================================================================
# haloquest -- descriptive-vqa cell, four-layer stack
# =============================================================================
# TERMINAL VALUES (paper numbers, Qwen2.5-Omni-7B, n=365, Token-F1):
#   34.22 base (v1 greedy)
#     -> 35.41  + output contract v2        (haloquest_contract_v2)
#     -> 39.87  + answerability gate, A2 routing
#                                      (haloquest_answerability_contract_gate)
#     -> 40.06  + BoN delta-selection on the pass-through branch
#                                      (haloquest_bon_stacked_full)
#     -> 40.14  + feature-combo selection z(Delta) - 0.25 z(CE) + 2.0 z(VAS)
#                                      (haloquest_bon_stacked_feat_combo)  <-- TERMINAL
#   random-selection control 39.44; oracle 44.55.
#   PROVENANCE: RESULTS.md rows 2026-08-15 (four rows: contract v2 / gate /
#   combined / stacked / feat-combo terminal), registry_verdicts.json
#   haloquest.prompt_program ("v2 contract kept, four-layer terminal 40.14").
#
# LAYERS AND THEIR ARTIFACTS
#   1. base v1 greedy      outputs/haloquest_base_model/..._full_single_scored.jsonl
#   2. contract v2 greedy  outputs/haloquest_contract_v2/..._full_single_scored.jsonl
#      (regenerable with `--stage base` / `--stage contract`; when regenerating,
#       point base_v1 / contract_v2 below at the fresh files before routing)
#   3. answerability gate  outputs/answerability/haloquest_answerability_gate_full.jsonl
#      -- consumed as an ARTIFACT. Produced by the research scripts
#      answerability_probe.py (4 teacher-forced forwards/item) +
#      answerability_gate.py (lr4 scorer, T3 template, flag-rate 0.35,
#      tau -0.0516, test precision 0.7069 > 0.70 gate). Kept unmodified.
#   4. route + BoN + feat  merged into confess_pipeline.py from
#      answerability_contract_gate.py / bon_stacked_haloquest.py /
#      bon_stacked_feat_combo.py.
#
# ROUTING POLICY: A2, frozen from the dev-100 grid
#   {A0 37.523, A1 38.306, A2 40.164, A3 39.402, A4 40.078, C1 40.164}
#   (max() -> A2, first maximum; A2 and C1 tie -- outputs/answerability_contract/
#   contract_gate_result.json). A2: keep v2 answer unless (flagged or v1
#   already evasion-phrased); gate pred otherwise.
#
# PROMPT: v2 contract is terminal. v3 (sentence-pattern echo) and v4
# (precision/brevity) both failed their dev gates on the frozen four-layer
# stack (dev -0.98 / -0.63; full v4 39.33 vs 40.14) -- registry_verdicts.json
# haloquest.prompt_program, TRAJECTORY_ANALYSIS.md section 8.7. Registry:
# haloquest/baseline/v2, 755 chars, md5 12e79431.
# =============================================================================

task_type: descriptive-vqa
dataset: haloquest

data_path: OmniHalluBench/haloquest/haloquest.json   # 365 items
data_root: OmniHalluBench

prompt_version: v2        # terminal contract version (layer-2 / BoN prompt)
seed: 42
record_process: true

output_dir: outputs/pipeline/haloquest
time_path: outputs/pipeline/haloquest/time
file_name: haloquest_contract_v2

haloquest:
  # ---- upstream artifacts (layers 1-3; see header for how each is made) ----
  base_v1: outputs/haloquest_base_model/haloquest_base_model_full_single_scored.jsonl
  contract_v2: outputs/haloquest_contract_v2/haloquest_contract_v2_full_single_scored.jsonl
  gate: outputs/answerability/haloquest_answerability_gate_full.jsonl
  probe: outputs/answerability/haloquest_answerability_probe_p3.json   # randctrl only

  policy: A2              # dev-selected; see header

  # ---- layer-4 outputs (fresh; do not point these at the research files
  #      unless you intend to overwrite them) --------------------------------
  routed: outputs/pipeline/haloquest/haloquest_answerability_contract_gate_full.jsonl

  bon:
    out: outputs/pipeline/haloquest/haloquest_bon_stacked_full.jsonl
    num_sampled: 3        # 1 greedy + 3 sampled candidates
    temperature: 0.7
    max_new_tokens: 512
    rank_score: g_content # assertion-level Delta ranking (pre-fixed winner)
    seed: 42

  feat:
    out: outputs/pipeline/haloquest/haloquest_bon_stacked_feat_combo.jsonl
    beta: 0.25            # CE weight; fixed on the v1-pool dev split, NOT re-tuned
    gamma: 2.0            # VAS weight; same
    # dev z-params are re-derived from these two v1-pool artifacts:
    v1_feat: outputs/bon_probe/haloquest_bon_feat.json
    v1_pool: outputs/haloquest_bon_grounding/haloquest_bon_grounding.jsonl
